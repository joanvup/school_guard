{% extends "base.html" %}

{% block content %}
<style>
    .input-hidden-focus {
        caret-color: transparent;
    }

    .toggle-checkbox:checked {
        right: 0;
        border-color: #68d391;
    }
    .toggle-checkbox:checked + .toggle-label {
        background-color: #68d391;
    }

    #print-area {
        display: none;
    }

    @media print {
        body * {
            visibility: hidden;
        }

        #print-area,
        #print-area * {
            visibility: visible;
        }

        #print-area {
            position: absolute;
            left: 0;
            top: 0;
            display: block !important;
            width: 72mm;
            padding: 2mm;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            color: black;
            background: white;
        }

        @page {
            size: 75mm auto;
            margin: 0mm;
        }
    }
</style>

<div class="max-w-2xl mx-auto no-print">
    <div class="bg-green-600 text-white p-4 rounded-t-lg shadow-lg flex justify-between items-center">
        <div>
            <h2 class="text-2xl font-bold"><i class="fas fa-utensils mr-2"></i> Control de Almuerzos</h2>
            <p class="text-green-100 text-sm">Escanee QR/RFID o busque por nombre</p>
        </div>
        <div id="inputStatus" class="bg-green-700 px-3 py-1 rounded text-xs font-mono transition-colors">
            <i class="fas fa-keyboard"></i> Listo
        </div>
    </div>

    <div class="bg-white p-6 rounded-b-lg shadow-lg border-x border-b">
        <div class="mb-4 relative">
            <input type="text" id="rfidInput"
                class="w-full border-2 border-gray-300 rounded p-3 text-lg focus:border-green-500 focus:ring-green-200 focus:outline-none font-mono tracking-widest input-hidden-focus"
                placeholder="Clic aquí para escanear QR o RFID..." autocomplete="off" inputmode="text">

            <div class="absolute right-3 top-4 text-gray-400">
                <i class="fas fa-wifi"></i>
            </div>
        </div>

        <div class="flex flex-wrap gap-4 mb-4 items-center">
            <button onclick="toggleCamera()"
                class="text-green-600 text-sm font-bold underline hover:text-green-800 transition">
                <i class="fas fa-camera"></i> Mostrar/Ocultar Cámara
            </button>
            <button onclick="openSearchModal()"
                class="text-blue-600 text-sm font-bold underline hover:text-blue-800 transition">
                <i class="fas fa-search"></i> Buscar por Nombre
            </button>

            <div class="flex items-center ml-auto">
                <label class="relative inline-flex items-center cursor-pointer" title="Imprimir ticket automáticamente">
                    <input type="checkbox" id="autoPrintToggle" class="sr-only peer" checked>
                    <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-green-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-green-600"></div>
                </label>
                <span class="ml-3 text-sm font-medium text-gray-700">Imprimir Ticket</span>
            </div>
        </div>

        <p id="connection-error" class="hidden mb-4 text-sm text-red-600 bg-red-50 border border-red-200 rounded p-2"></p>

        <div id="cameraContainer"
            class="hidden bg-black rounded-lg overflow-hidden shadow-xl relative mb-4 transition-all"
            style="min-height: 300px;">
            <div id="reader" class="w-full h-full"></div>
        </div>
        <p id="camera-error" class="hidden mb-4 text-sm text-red-600 bg-red-50 border border-red-200 rounded p-2"></p>

        <div id="resultCard" class="hidden animate-fade-in-up">
            <div id="resultBg" class="border-4 rounded-lg p-6 text-center transition-colors duration-300">
                <div class="flex flex-col items-center">
                    <img id="resPhoto" src="/static/assets/avatar.png" alt="Foto de la persona"
                        class="w-32 h-32 rounded-full object-cover border-4 border-white shadow-lg mb-4 bg-gray-100">
                    <h2 id="resName" class="text-2xl font-bold text-gray-800 leading-tight">---</h2>
                    <p id="resExtra" class="text-gray-500 font-bold text-lg mb-1"></p>
                    <span id="resPersonType"
                        class="bg-gray-200 text-gray-600 px-2 py-0.5 rounded text-xs uppercase font-bold"></span>
                </div>

                <div id="resLunchBox" class="mt-6 p-4 rounded-lg text-white transition-colors duration-300">
                    <p class="text-sm uppercase opacity-90 font-bold">Tipo de Menú</p>
                    <h1 id="resLunchType" class="text-5xl font-extrabold tracking-wider">--</h1>
                </div>

                <div id="resMsg" class="mt-4 font-bold text-lg text-gray-700"></div>

                <button id="btnPrint" onclick="reprintCurrentTicket()"
                    class="mt-6 bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded text-sm font-bold hidden">
                    <i class="fas fa-print mr-2"></i> Reimprimir Ticket
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Plantilla de impresión: solo se llena al imprimir -->
<div id="print-area">
    <div style="font-size: 12px; font-weight: bold; margin-bottom: 5px;">COLEGIO BILINGÜE</div>
    <div style="font-size: 9px; margin-bottom: 5px;">CONTROL DE ALIMENTACIÓN</div>
    <hr style="border-top: 1px dashed #000; margin: 5px 0;">

    <div id="ticket-type" style="font-size: 18px; font-weight: 900; margin: 8px 0;">NORMAL</div>
    <div id="ticket-number" style="font-size: 9px; margin-bottom: 4px;"></div>
    <div id="ticket-name" style="font-size: 11px; font-weight: bold; line-height: 1.2;">NOMBRE</div>
    <div id="ticket-extra" style="font-size: 10px; margin-top: 2px;">CURSO</div>

    <div style="font-size: 9px; margin-top: 8px;">
        <span id="ticket-date">YYYY-MM-DD</span> - <span id="ticket-time">HH:MM</span>
    </div>

    <div style="display: flex; justify-content: center; margin-top: 8px;">
        <div id="ticket-qr"></div>
    </div>
</div>

<!-- MODAL BÚSQUEDA MANUAL -->
<div id="modalSearch" class="fixed inset-0 bg-gray-600 bg-opacity-75 hidden flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-md mx-4 overflow-hidden">
        <div class="bg-blue-600 px-4 py-3 border-b flex justify-between items-center">
            <h3 class="text-lg font-bold text-white"><i class="fas fa-search mr-2"></i> Buscar Persona</h3>
            <button onclick="closeSearchModal()" class="text-blue-100 hover:text-white text-2xl">&times;</button>
        </div>
        <div class="p-4">
            <div class="flex gap-2 mb-4">
                <input type="text" id="searchInput" placeholder="Escriba nombre (min 3 letras)..."
                    class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-300 outline-none"
                    onkeydown="if(event.key === 'Enter'){ event.preventDefault(); executeSearch(); }">
                <button onclick="executeSearch()"
                    class="bg-blue-600 text-white px-4 py-2 rounded font-bold hover:bg-blue-700">
                    <i class="fas fa-search"></i>
                </button>
            </div>
            <div id="searchResults" class="space-y-2 max-h-60 overflow-y-auto">
                <p class="text-gray-400 text-center text-sm mt-2">Los resultados aparecerán aquí...</p>
            </div>
        </div>
    </div>
</div>

<script src="/static/js/html5-qrcode.min.js"></script>
<script src="/static/js/qrcode.min.js"></script>

<script>
    const PLACEHOLDER_PHOTO = '/static/assets/avatar.png';
    const rfidInput = document.getElementById('rfidInput');
    const inputStatus = document.getElementById('inputStatus');
    const autoPrintToggle = document.getElementById('autoPrintToggle');
    const STORAGE_KEY = 'lunch_auto_print';

    let isProcessing = false;
    let pendingPayload = null;
    let html5QrcodeScanner = null;
    let currentTicket = null;
    let printInProgress = false;
    let queuedTicket = null;
    let printFallbackTimer = null;

    // --- IMPRESIÓN CON COLA ---
    function initPrintToggle() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved !== null) autoPrintToggle.checked = saved === 'true';
    }

    autoPrintToggle.addEventListener('change', () => {
        localStorage.setItem(STORAGE_KEY, autoPrintToggle.checked);
    });

    function prepareTicket(ticket) {
        document.getElementById('ticket-name').innerText = ticket.name || '';
        document.getElementById('ticket-type').innerText = (ticket.lunch_type || '').toUpperCase();
        document.getElementById('ticket-extra').innerText = ticket.extra || '';
        document.getElementById('ticket-date').innerText = ticket.date || '';
        document.getElementById('ticket-time').innerText = ticket.time || '';
        document.getElementById('ticket-number').innerText = ticket.number ? 'No. ' + ticket.number : '';

        const qrContainer = document.getElementById('ticket-qr');
        qrContainer.innerHTML = '';
        try {
            new QRCode(qrContainer, {
                text: ticket.qr || ticket.public_id || '',
                width: 128,
                height: 128,
                colorDark: '#000000',
                colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.M
            });
        } catch (error) {
            qrContainer.innerText = 'QR no disponible';
        }
    }

    function enqueuePrint(ticket) {
        if (!ticket) return;
        if (printInProgress) {
            queuedTicket = ticket;
            return;
        }

        printInProgress = true;
        prepareTicket(ticket);

        requestAnimationFrame(() => {
            setTimeout(() => {
                try {
                    window.print();
                } catch (error) {
                    releasePrint();
                }
            }, 50);
        });

        clearTimeout(printFallbackTimer);
        printFallbackTimer = setTimeout(releasePrint, 30000);
    }

    function releasePrint() {
        if (!printInProgress) return;
        printInProgress = false;
        clearTimeout(printFallbackTimer);
        if (queuedTicket) {
            const next = queuedTicket;
            queuedTicket = null;
            setTimeout(() => enqueuePrint(next), 250);
        }
    }

    window.addEventListener('afterprint', releasePrint);

    function reprintCurrentTicket() {
        if (!currentTicket) return;
        reprintTicket(currentTicket.public_id);
    }

    async function reprintTicket(publicId) {
        clearConnectionError();
        try {
            const { response, data } = await apiFetch(
                `/lunch/tickets/${encodeURIComponent(publicId)}/reprint`,
                { method: 'POST' }
            );
            if (response.status === 401) {
                window.location.href = '/login';
                return;
            }
            if (!response.ok) {
                showConnectionError(apiErrorMessage(data, 'No fue posible reimprimir el ticket.'));
                return;
            }
            if (data.over_limit) {
                showConnectionError('Advertencia: este ticket supera las 3 reimpresiones registradas.');
            }
            currentTicket = data.ticket;
            enqueuePrint(data.ticket);
        } catch (error) {
            showConnectionError('No fue posible conectar con el servidor para reimprimir.');
        }
    }

    // --- INPUT Y FOCO ---
    rfidInput.focus();

    document.addEventListener('click', (event) => {
        const tag = event.target.tagName;
        if (tag !== 'BUTTON' && tag !== 'INPUT' && tag !== 'A' && tag !== 'IMG') {
            rfidInput.focus();
        }
    });

    rfidInput.addEventListener('blur', () => {
        inputStatus.className = 'bg-yellow-500 px-3 py-1 rounded text-xs font-mono text-white';
        inputStatus.innerHTML = 'Lector en Pausa';
    });

    rfidInput.addEventListener('focus', () => {
        inputStatus.className = 'bg-green-700 px-3 py-1 rounded text-xs font-mono text-white';
        inputStatus.innerHTML = 'Lector Listo';
    });

    rfidInput.addEventListener('keydown', function (event) {
        if (event.key !== 'Enter') return;
        event.preventDefault();
        const code = rfidInput.value.replace(/\s+/g, '').trim();
        rfidInput.value = '';
        if (code.length > 0) sendScannedCode(code);
    });

    function classifyScannedCode(code) {
        if (code.startsWith('v2.')) return 'qr';
        return /\.[0-9a-fA-F]{16}$/.test(code) ? 'qr' : 'rfid';
    }

    function sendScannedCode(code) {
        sendPayload({ method: classifyScannedCode(code), code: code });
    }

    // --- CÁMARA ---
    async function toggleCamera() {
        const container = document.getElementById('cameraContainer');
        clearCameraError();

        if (container.classList.contains('hidden')) {
            container.classList.remove('hidden');
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                showCameraError('Este navegador no permite usar la cámara. Use el lector o la búsqueda manual.');
                return;
            }
            if (!html5QrcodeScanner) {
                html5QrcodeScanner = new Html5QrcodeScanner(
                    'reader',
                    { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 },
                    false
                );
                html5QrcodeScanner.render(onScanSuccess, () => { });
            }
        } else {
            container.classList.add('hidden');
            if (html5QrcodeScanner) {
                try {
                    await html5QrcodeScanner.clear();
                } catch (error) {
                    console.error('Error al limpiar cámara', error);
                }
                html5QrcodeScanner = null;
            }
        }
    }

    function onScanSuccess(decodedText) {
        sendScannedCode(decodedText);
        if (html5QrcodeScanner) {
            try {
                html5QrcodeScanner.pause();
                setTimeout(() => {
                    if (html5QrcodeScanner) html5QrcodeScanner.resume();
                }, 2500);
            } catch (error) {
                // La cámara pudo haberse cerrado.
            }
        }
    }

    // --- ENVÍO AL SERVIDOR ---
    async function sendPayload(payload) {
        if (isProcessing) {
            pendingPayload = payload;
            return;
        }

        isProcessing = true;
        clearConnectionError();
        clearResult();
        inputStatus.className = 'bg-blue-600 px-3 py-1 rounded text-xs font-mono text-white';
        inputStatus.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Procesando';

        try {
            const { response, data } = await apiFetch('/lunch/process', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.status === 401) {
                window.location.href = '/login';
                return;
            }
            if (!response.ok && !data) {
                showConnectionError(apiErrorMessage(data, `Error del servidor (${response.status})`));
                return;
            }
            showResult(data);
        } catch (error) {
            const message = error.name === 'AbortError'
                ? 'El servidor tardó demasiado en responder.'
                : 'No fue posible conectar con el servidor.';
            showConnectionError(message);
        } finally {
            isProcessing = false;
            inputStatus.className = 'bg-green-700 px-3 py-1 rounded text-xs font-mono text-white';
            inputStatus.innerHTML = '<i class="fas fa-keyboard"></i> Listo';
            rfidInput.focus();
            if (pendingPayload) {
                const next = pendingPayload;
                pendingPayload = null;
                setTimeout(() => sendPayload(next), 150);
            }
        }
    }

    // --- RESULTADO ---
    function clearResult() {
        document.getElementById('resultCard').classList.add('hidden');
        document.getElementById('btnPrint').classList.add('hidden');
        currentTicket = null;
    }

    function clearConnectionError() {
        document.getElementById('connection-error').classList.add('hidden');
    }

    function showConnectionError(message) {
        const box = document.getElementById('connection-error');
        box.innerText = message;
        box.classList.remove('hidden');
    }

    function clearCameraError() {
        document.getElementById('camera-error').classList.add('hidden');
    }

    function showCameraError(message) {
        const box = document.getElementById('camera-error');
        box.innerText = message;
        box.classList.remove('hidden');
    }

    function setPhoto(photoUrl) {
        const img = document.getElementById('resPhoto');
        img.src = photoUrl || PLACEHOLDER_PHOTO;
        img.onerror = () => { img.onerror = null; img.src = PLACEHOLDER_PHOTO; };
    }

    function showResult(data) {
        if (!data || typeof data !== 'object') {
            showConnectionError('Respuesta inválida del servidor.');
            return;
        }

        document.getElementById('resultCard').classList.remove('hidden');
        document.getElementById('resName').innerText = '---';
        document.getElementById('resExtra').innerText = '';
        document.getElementById('resPersonType').innerText = '';
        document.getElementById('resLunchType').innerText = '--';
        setPhoto(null);

        if (data.person) {
            document.getElementById('resName').innerText = data.person.name;
            document.getElementById('resExtra').innerText = data.person.extra;
            document.getElementById('resPersonType').innerText = data.person.type;
            setPhoto(data.person.photo);
        } else {
            document.getElementById('resName').innerText = 'NO ENCONTRADO';
        }

        const bg = document.getElementById('resultBg');
        const box = document.getElementById('resLunchBox');
        const lunchTitle = document.getElementById('resLunchType');
        document.getElementById('resMsg').innerText = data.message || '';
        document.getElementById('btnPrint').classList.add('hidden');
        currentTicket = null;

        if (data.status === 'success') {
            lunchTitle.innerText = data.lunch_type || 'NORMAL';
            if (data.lunch_type === 'Especial') {
                bg.className = 'border-4 border-purple-500 bg-purple-50 rounded-lg p-6 text-center';
                box.className = 'mt-6 p-4 rounded-lg text-white bg-purple-600 shadow-lg';
            } else {
                bg.className = 'border-4 border-green-500 bg-green-50 rounded-lg p-6 text-center';
                box.className = 'mt-6 p-4 rounded-lg text-white bg-green-600 shadow-lg';
            }
            playFeedbackSound(true);

            if (data.ticket) {
                currentTicket = data.ticket;
                document.getElementById('btnPrint').classList.remove('hidden');
                if (autoPrintToggle.checked) enqueuePrint(data.ticket);
            }
        } else if (data.status === 'warning') {
            lunchTitle.innerText = data.lunch_type || 'NORMAL';
            bg.className = 'border-4 border-orange-500 bg-orange-50 rounded-lg p-6 text-center';
            box.className = 'mt-6 p-4 rounded-lg text-white bg-orange-500 shadow-lg';
            playFeedbackSound(false);

            if (data.ticket) {
                currentTicket = data.ticket;
                document.getElementById('btnPrint').classList.remove('hidden');
            }
        } else {
            lunchTitle.innerText = data.status === 'denied' ? 'NO AUTORIZADO' : 'ERROR';
            bg.className = 'border-4 border-red-600 bg-red-50 rounded-lg p-6 text-center';
            box.className = 'mt-6 p-4 rounded-lg text-white bg-red-600 shadow-lg';
            playFeedbackSound(false);
        }
    }

    // --- BÚSQUEDA MANUAL ---
    const modalSearch = document.getElementById('modalSearch');
    const searchInput = document.getElementById('searchInput');
    const searchResults = document.getElementById('searchResults');

    function openSearchModal() {
        modalSearch.classList.remove('hidden');
        searchInput.value = '';
        searchResults.innerHTML = '<p class="text-gray-400 text-center text-sm mt-2">Digite nombre...</p>';
        setTimeout(() => searchInput.focus(), 100);
    }

    function closeSearchModal() {
        modalSearch.classList.add('hidden');
        rfidInput.focus();
    }

    async function executeSearch() {
        const q = searchInput.value.trim();
        if (q.length < 3) {
            searchResults.innerHTML = '<p class="text-gray-500 text-center text-sm">Escriba al menos 3 letras.</p>';
            return;
        }

        searchResults.innerHTML = '<div class="text-center py-2"><i class="fas fa-circle-notch fa-spin text-blue-500"></i></div>';

        try {
            const { response, data } = await apiFetch(`/lunch/search_person?q=${encodeURIComponent(q)}`);
            if (!response.ok) {
                searchResults.innerHTML = '';
                const message = document.createElement('p');
                message.className = 'text-red-600 text-center text-sm';
                message.innerText = apiErrorMessage(data, 'No fue posible realizar la búsqueda.');
                searchResults.appendChild(message);
                return;
            }

            searchResults.innerHTML = '';
            if (!Array.isArray(data) || data.length === 0) {
                const empty = document.createElement('p');
                empty.className = 'text-gray-500 text-center text-sm';
                empty.innerText = 'Sin resultados.';
                searchResults.appendChild(empty);
                return;
            }

            data.forEach((person) => {
                const row = document.createElement('button');
                row.type = 'button';
                row.className = 'w-full flex items-center p-2 border rounded hover:bg-blue-50 cursor-pointer transition text-left';
                row.addEventListener('click', () => selectManual(person.person_type, person.person_id));

                const img = document.createElement('img');
                img.src = person.photo || PLACEHOLDER_PHOTO;
                img.alt = person.name;
                img.className = 'w-10 h-10 rounded-full object-cover border mr-3 bg-gray-100';
                img.onerror = () => { img.onerror = null; img.src = PLACEHOLDER_PHOTO; };

                const info = document.createElement('div');
                info.className = 'flex-1';

                const name = document.createElement('p');
                name.className = 'text-sm font-bold text-gray-800';
                name.innerText = person.name;

                const detail = document.createElement('p');
                detail.className = 'text-xs text-gray-500';
                detail.innerText = `${person.type} - ${person.extra || ''}${person.has_lunch ? '' : ' (sin almuerzo)'}`;

                info.appendChild(name);
                info.appendChild(detail);

                const icon = document.createElement('i');
                icon.className = 'fas fa-chevron-right text-gray-400';

                row.appendChild(img);
                row.appendChild(info);
                row.appendChild(icon);
                searchResults.appendChild(row);
            });
        } catch (error) {
            searchResults.innerHTML = '<p class="text-red-600 text-center text-sm">Error de conexión.</p>';
        }
    }

    function selectManual(personType, personId) {
        closeSearchModal();
        sendPayload({ method: 'manual', person_type: personType, person_id: personId });
    }

    document.addEventListener('DOMContentLoaded', initPrintToggle);
</script>
{% endblock %}
